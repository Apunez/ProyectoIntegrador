<div class="two"><div class="box"><h3 style="margin-top:0">Sobre la empresa</h3><p>Aceros Arequipa es uno de los principales productores de acero del Perú. Su portafolio se orienta a barras de construcción, alambrones y otros productos largos, con operación industrial en Pisco (Ica) y presencia comercial en todo el país.</p><p class="s" style="color:var(--mut)">Descripción general de información pública; para detalle societario consulta su memoria anual.</p></div>
